<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APEX — Global marketplace. Shop the world.</title>
    <meta name="description" content="APEX is a global marketplace where anyone, anywhere can buy and sell. Trending fashion, electronics, home and more with fast worldwide shipping and secure payments." />
    <meta name="google-site-verification" content="yyZx-AAUI1govje-1drsFQ4gHGDdNh90quBszvr9QXM" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="APEX" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <meta name="author" content="APEX" />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="apex, global marketplace, online shopping, fashion, electronics, worldwide shipping, buy and sell online, ecommerce" />

    <meta property="og:site_name" content="APEX" />
    <meta property="og:title" content="APEX — Global marketplace. Shop the world." />
    <meta property="og:description" content="Trending products from around the world with fast shipping and secure payments." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.marketayiti.shop/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="APEX — Global marketplace" />
    <meta name="twitter:description" content="Trending products from around the world with fast shipping and secure payments." />

    <link rel="canonical" href="https://www.marketayiti.shop/" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "APEX",
      "url": "https://www.marketayiti.shop/",
      "logo": "https://www.marketayiti.shop/icons/icon-512x512.png",
      "description": "Global marketplace to buy and sell worldwide.",
      "sameAs": ["https://marketayiti.shop"]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "APEX",
      "alternateName": "marketayiti",
      "url": "https://www.marketayiti.shop/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.marketayiti.shop/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
